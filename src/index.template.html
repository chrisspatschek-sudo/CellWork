@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url(data:font/woff2;base64,/*FONTDATA*/) format("woff2")}
:root{
  --mat:#2D5A4B; --mat-line:rgba(255,255,255,.065); --mat-line-2:rgba(255,255,255,.14);
  --panel:#F0F2EE; --panel-2:#E3E7E1; --control:#FFFFFF; --ink:#17201C; --ink-2:#5A645F; --rule:#CCD3CB;
  --accent:#1E4A3D; --accent-ink:#F4F7F3; --cut:#D7263D; --outline-cut:#2662C9; --focus:#2F7DE1;
  --float:rgba(246,248,245,.92); --shadow:0 6px 24px rgba(10,30,22,.22);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --mat:#18322A; --mat-line:rgba(255,255,255,.05); --mat-line-2:rgba(255,255,255,.1);
    --panel:#151917; --panel-2:#212724; --control:#262D2A; --ink:#E6EAE6; --ink-2:#9AA49F; --rule:#323A36;
    --accent:#8CCBB2; --accent-ink:#0F1C17; --cut:#FF5466; --outline-cut:#6B9BFF; --focus:#79AEFF;
    --float:rgba(28,33,31,.92); --shadow:0 6px 24px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --mat:#18322A; --mat-line:rgba(255,255,255,.05); --mat-line-2:rgba(255,255,255,.1);
  --panel:#151917; --panel-2:#212724; --control:#262D2A; --ink:#E6EAE6; --ink-2:#9AA49F; --rule:#323A36;
  --accent:#8CCBB2; --accent-ink:#0F1C17; --cut:#FF5466; --outline-cut:#6B9BFF; --focus:#79AEFF;
  --float:rgba(28,33,31,.92); --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme: dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--ink);font:14px/1.45 "Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{display:grid;grid-template-columns:340px 1fr;height:100%}
.panel{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--rule);background:var(--panel);min-height:0}
#controls{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px 14px;background:var(--panel);border-bottom:1px solid var(--rule);flex:none}
.tabs{display:none}
.brand svg{flex:none}
.brand h1{font-size:19px;letter-spacing:-.01em;margin:0;font-weight:700}
.brand select{margin-left:auto;max-width:132px}
.sec{padding:16px 20px 18px;border-bottom:1px solid var(--rule)}
.sec h2{font-size:15px;font-weight:650;margin:0 0 10px;letter-spacing:-.005em}
.field{margin:12px 0 0}
.field:first-of-type{margin-top:4px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;color:var(--ink-2);font-size:13px;margin-bottom:6px}
.lbl output{color:var(--ink);font-weight:500}
.hint{color:var(--ink-2);font-size:12.5px;margin:7px 0 0;line-height:1.45}
.hint.warn{color:var(--cut)}
.report{background:var(--panel-2);border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.5;margin-top:2px}
.report b{font-weight:650}
.bad{color:var(--cut);font-weight:600}
.good{color:var(--ink-2)}
.seg{display:flex;background:var(--panel-2);border-radius:9px;padding:3px;gap:2px}

.seg button[aria-checked="true"]{background:var(--control);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

.togrow span{color:var(--ink);font-size:13.5px}
.switch{width:40px;height:24px;border-radius:12px;border:0;background:var(--rule);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.btn{border:1px solid var(--rule);background:var(--control);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btnrow .btn{flex:1 1 auto}
.swatches{display:flex;gap:3px;margin-top:6px;height:14px}
.swatches i{flex:1;border-radius:3px}

.stage{position:relative;overflow:hidden;background:var(--mat);touch-action:none;min-height:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.stage.panning canvas{cursor:grabbing}
.float{position:absolute;background:var(--float);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:2px;padding:4px}
.float button{border:0;background:transparent;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.float button:hover{color:var(--ink)}
.float button[aria-pressed="true"]{background:var(--control);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.float .sep{width:1px;align-self:stretch;background:var(--rule);margin:4px 4px}
.tools{top:14px;left:14px}
.views{top:14px;right:14px}
.zoomval{min-width:46px;text-align:center;font-size:12.5px;color:var(--ink-2)}
.tip{position:absolute;top:62px;left:14px;font-size:12px;color:rgba(255,255,255,.72);pointer-events:none}
.actions{bottom:16px;left:50%;transform:translateX(-50%);padding:6px;gap:6px;white-space:nowrap}
.actions .go{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:8px 16px}
.actions .go:hover{color:var(--accent-ink)}
.actions .stat{font-size:12.5px;color:var(--ink-2);padding:0 8px}
.actions .stat b{color:var(--ink);font-weight:600}
.actions .stat .bad{font-weight:600}
.drop{position:absolute;inset:12px;border:2px dashed rgba(255,255,255,.6);border-radius:16px;display:none;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600;pointer-events:none;background:rgba(0,0,0,.25)}
.stage.dragover .drop{display:flex}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80%;text-align:center}
.toast.show{opacity:1}
.ico{width:16px;height:16px;flex:none}

@media (max-width: 820px){
  html,body{overflow:hidden}
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,53fr) minmax(0,47fr);height:100%}
  .stage{order:-1}
  .panel{border-right:0;border-top:1px solid var(--rule)}
  .brand{padding:8px 14px 6px;border-bottom:0}
  .brand h1{font-size:16px}
  .brand svg{width:22px;height:22px}
  .tabs{display:flex;flex:none;gap:2px;padding:0 8px 6px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:1 0 auto;border:0;background:transparent;padding:8px 9px;border-radius:8px;font-size:13.5px;color:var(--ink-2);position:relative;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--ink);font-weight:600}

  .sec:not(.on){display:none}
  .sec{border-bottom:0;padding-top:12px}
  .tip{display:none}
  .views{top:auto;bottom:70px;right:10px}
  .tools{top:10px;left:10px}
  .float button{padding:6px 8px}
  .tools .txt{display:none}
  .float button{padding:6px 7px}
  .actions{bottom:10px;left:10px;right:10px;transform:none;justify-content:space-between}
  .actions .stat{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<script>
"use strict";
const CL = ClipperLib;
const SC = 1000;            // Clipper integer units per mm
const MAXP = 8000;
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ---------------- settings ---------------- */
const DEFAULTS = {
  shape:'rect', width:200, height:200, cornerR:0, ringInner:40, margin:6,
  dist:'even', sizeBy:'count', count:300, spacing:10, jitter:30, seed:1,
  grad:'radial', ratio:3, falloff:1, flip:false, angle:0, cx:50, cy:50, noiseScale:50,
  relaxSteps:4,
  mode:'holes', web:2, radius:1.5, minHole:1, outline:true, material:'birch',
  lineWeight:0.3, palette:'terrazzo', colorBy:'random', dpi:300,
  holeShape:'cell', holeScale:85, blob:60, slotWidth:45, slotDir:'cell', slotAngle:0, webGrow:0,
  brushMode:'denser', brushSize:20, brushStrength:0.5,
  mountD:4, mountClear:4, mountInset:10,
  machine:'laser', kerf:0.15, bitDia:3.175, minWeb:2, minFeature:1, check:true, skipSmall:false, compensate:false,
  cutSpeed:20, travelSpeed:200, pierce:0.2, passes:1,
  sites:true, edges:false, delaunay:false
};
let S = {...DEFAULTS};

const MATERIALS = {
  birch:{name:'Birch plywood', c:'#E2CB9F', e:'#C9AE7E'},
  walnut:{name:'Walnut', c:'#6E4C35', e:'#4F3524'},
  white:{name:'White acrylic', c:'#F5F5F2', e:'#D9D9D4'},
  black:{name:'Black acrylic', c:'#232323', e:'#0E0E0E'},
  brass:{name:'Brass', c:'#C8A24A', e:'#A3812F'},
  steel:{name:'Steel', c:'#AEB5B9', e:'#8D9599'},
  felt:{name:'Grey felt', c:'#8D9093', e:'#6E7174'}
};
const PALETTES = {
  terrazzo:{name:'Terrazzo', bg:'#F1ECE3', c:['#C65B3E','#E3A857','#3E6B5A','#2B3A4A','#D9C7B0']},
  reef:{name:'Reef', bg:'#0F2A33', c:['#1F7A8C','#7FC8A9','#F2E8CF','#E07A5F','#3D5A80']},
  canopy:{name:'Canopy', bg:'#1C2618', c:['#31572C','#4F772D','#90A955','#ECF39E','#A3B18A']},
  glass:{name:'Stained glass', bg:'#161616', c:['#B23A48','#2F6690','#F2C14E','#3A7D44','#7D5BA6']},
  kiln:{name:'Kiln', bg:'#2A1D17', c:['#7A2E1D','#B4532A','#E09F3E','#F3D9A4','#5C3D2E']},
  ice:{name:'Glacier', bg:'#E9EEF1', c:['#0B3954','#087E8B','#5FB3C2','#BFD7EA','#F2F7F9']},
  ink:{name:'Ink wash', bg:'#FFFFFF', c:['#121212','#3A3A3A','#6B6B6B','#9C9C9C','#D0D0D0']}
};

/* ---------------- state ---------------- */
let region = [], regionF = [], bbox = {x0:0,y0:0,x1:1,y1:1,w:1,h:1}, areaMM = 0, intD = 0;
let pReg = [], pRegF = [], mask = null, regionHash = null, clipF = [], clipInt = [], clipHash = null;
let points = [], del = null, vor = null;
let holes = [], edgesF = [], dropped = 0;
let custom = null, densImg = null;
let view = {s:1, x:0, y:0, fit:1}, cw = 0, ch = 0, dpr = 1;
let undoStack = [], redoStack = [];
let tool = 'move', spaceDown = false, autoOn = false, hoverIdx = -1;
let lastSpacing = 10;
let mounts = [], strokes = [], paint = null, PW = 0, PH = 0, pmin = 0, pmax = 0;
let keepInt = [], keepF = [], mountF = [], thin = [], thinCount = 0, skipped = 0, report = null, mouseW = null;

/* ---------------- helpers ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y,s){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,2246822519);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
const toInt = p => p.map(q => ({X:Math.round(q[0]*SC), Y:Math.round(q[1]*SC)}));
const toF = p => p.map(q => [q.X/SC, q.Y/SC]);

function cUnion(paths){const c=new CL.Clipper();c.AddPaths(paths,CL.PolyType.ptSubject,true);const s=new CL.Paths();c.Execute(CL.ClipType.ctUnion,s,CL.PolyFillType.pftEvenOdd,CL.PolyFillType.pftEvenOdd);return s}
function cOffset(paths,delta,join,tol){if(!delta)return paths;const o=new CL.ClipperOffset(2,tol||15);o.AddPaths(paths,join,CL.EndType.etClosedPolygon);const s=new CL.Paths();o.Execute(s,delta);return s}
function cInter(a,b){const c=new CL.Clipper();c.AddPaths(a,CL.PolyType.ptSubject,true);c.AddPaths(b,CL.PolyType.ptClip,true);const s=new CL.Paths();c.Execute(CL.ClipType.ctIntersection,s,CL.PolyFillType.pftNonZero,CL.PolyFillType.pftNonZero);return s}
function cDiff(a,b){if(!a.length)return [];if(!b.length)return a;const c=new CL.Clipper();c.AddPaths(a,CL.PolyType.ptSubject,true);c.AddPaths(b,CL.PolyType.ptClip,true);const s=new CL.Paths();c.Execute(CL.ClipType.ctDifference,s,CL.PolyFillType.pftNonZero,CL.PolyFillType.pftNonZero);return s}
function cUnionNZ(paths){if(!paths.length)return [];const c=new CL.Clipper();c.AddPaths(paths,CL.PolyType.ptSubject,true);const s=new CL.Paths();c.Execute(CL.ClipType.ctUnion,s,CL.PolyFillType.pftNonZero,CL.PolyFillType.pftNonZero);return s}
function fixO(p){if(!CL.Clipper.Orientation(p))p.reverse();return p}
function offsetOpen(path,delta,tol){const o=new CL.ClipperOffset(2,tol||15);o.AddPath(path,CL.JoinType.jtRound,CL.EndType.etOpenRound);const s=new CL.Paths();o.Execute(s,delta);return s}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;const t=l?clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1):0;return Math.hypot(px-ax-t*dx,py-ay-t*dy)}
function cArea(paths){let a=0;for(const p of paths)a+=CL.Clipper.Area(p);return Math.abs(a)/(SC*SC)}

function pipF(x,y,paths){
  let c=false;
  for(const p of paths){
    for(let i=0,j=p.length-1;i<p.length;j=i++){
      const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];
      if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c;
    }
  }
  return c;
}

/* --- spatial hash of boundary segments: tells whether a box touches the outline --- */
function makeHash(paths, cell){
  const h = {cell, set:new Set()};
  for(const p of paths){
    for(let i=0,j=p.length-1;i<p.length;j=i++){
      const ax=p[j][0],ay=p[j][1],bx=p[i][0],by=p[i][1];
      const len=Math.hypot(bx-ax,by-ay), n=Math.max(1,Math.ceil(len/(cell*0.5)));
      for(let k=0;k<=n;k++){const x=ax+(bx-ax)*k/n,y=ay+(by-ay)*k/n;h.set.add(Math.floor(x/cell)*131071+Math.floor(y/cell))}
    }

function hashHit(h,x0,y0,x1,y1){
  const c=h.cell, i0=Math.floor(x0/c)-1,i1=Math.floor(x1/c)+1,j0=Math.floor(y0/c)-1,j1=Math.floor(y1/c)+1;

/* --- raster inside-mask for fast point tests (exact test only near the outline) --- */
function buildMask(){
  const res = Math.max(bbox.w,bbox.h)/480;
  const cols=Math.ceil(bbox.w/res)+2, rows=Math.ceil(bbox.h/res)+2;
  const m=new Uint8Array(cols*rows);
  for(let r=0;r<rows;r++){
    const y=bbox.y0+(r+0.5)*res; const xs=[];
    for(const p of pRegF)for(let i=0,j=p.length-1;i<p.length;j=i++){
      const yi=p[i][1],yj=p[j][1];
      if((yi>y)!==(yj>y)) xs.push((p[j][0]-p[i][0])*(y-yi)/(yj-yi)+p[i][0]);

    xs.sort((a,b)=>a-b);

      const c0=Math.max(0,Math.ceil((xs[k]-bbox.x0)/res-0.5)), c1=Math.min(cols-1,Math.floor((xs[k+1]-bbox.x0)/res-0.5));

    const ax=p[j][0],ay=p[j][1],bx=p[i][0],by=p[i][1];
    const n=Math.max(1,Math.ceil(Math.hypot(bx-ax,by-ay)/(res*0.4)));

function inside(x,y){

  if(c<0||r<0||c>=mask.cols||r>=mask.rows)return false;
  const v=mask.m[r*mask.cols+c];
  return v===2 ? pipF(x,y,pRegF) : v===1;

/* ---------------- shapes ---------------- */
function ellipsePts(cx,cy,rx,ry){
  const n=clamp(Math.round(2*Math.PI*Math.max(rx,ry)/0.8),48,900), out=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2;out.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)])}
  return out;
}
function roundRectPts(w,h,r){
  if(r<=0.01)return [[0,0],[w,0],[w,h],[0,h]];
  const out=[], n=clamp(Math.round(r*1.2),6,64);
  const corners=[[w-r,r,-Math.PI/2],[w-r,h-r,0],[r,h-r,Math.PI/2],[r,r,Math.PI]];
  for(const [cx,cy,a0] of corners)for(let i=0;i<=n;i++){const a=a0+i/n*Math.PI/2;out.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}
  return out;
}
function shapePolys(){
  const W=S.width,H=S.height;
  switch(S.shape){
    case 'ellipse': return [ellipsePts(W/2,H/2,W/2,H/2)];
    case 'hex': return [[[0,H/2],[W/4,0],[W*3/4,0],[W,H/2],[W*3/4,H],[W/4,H]]];
    case 'ring': {const k=clamp(S.ringInner,5,95)/100;return [ellipsePts(W/2,H/2,W/2,H/2),ellipsePts(W/2,H/2,W/2*k,H/2*k)]}
    case 'custom': if(custom) return custom.paths.map(p=>p.map(q=>[q[0]*W,q[1]*W]));
    // falls through
    default: return [roundRectPts(W,H,Math.min(S.cornerR,W/2,H/2))];
  }
}
function buildRegion(){
  if(S.shape==='custom'&&custom) S.height=Math.round(S.width*custom.aspect*10)/10;
  region=cUnion(shapePolys().map(toInt));
  regionF=region.map(toF);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of regionF)for(const q of p){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1])}
  if(x0>x1){x0=0;y0=0;x1=S.width;y1=S.height}
  bbox={x0,y0,x1,y1,w:x1-x0,h:y1-y0};
  mounts=mounts.filter(m=>pipF(m[0],m[1],regionF));
  rebuildKeep();

/* keep-out zones (painted solid areas + mounting-hole rings) and the area points may use */
function rebuildKeep(){
  let acc=[];
  for(const st of strokes){
    const pts=st.pts.length>1?st.pts:[st.pts[0],[st.pts[0][0]+0.01,st.pts[0][1]]];
    const poly=offsetOpen(toInt(pts),st.r*SC,20);
    acc=st.m==='keep'?cUnionNZ([...acc,...poly]):cDiff(acc,poly);
  }
  mountF=mounts.map(m=>ellipsePts(m[0],m[1],S.mountD/2,S.mountD/2));
  if(mounts.length){const R=S.mountD/2+S.mountClear;acc=cUnionNZ([...acc,...mounts.map(m=>fixO(toInt(ellipsePts(m[0],m[1],R,R))))])}
  keepInt=acc;keepF=acc.map(toF);
  // points stay inside the solid border, so edge holes are clean rather than slivers
  pReg=S.margin>0?cOffset(region,-S.margin*SC,CL.JoinType.jtRound):region;
  if(keepInt.length)pReg=cDiff(pReg,keepInt);
  if(cArea(pReg)<cArea(region)*0.02)pReg=region;
  pRegF=pReg.map(toF);regionHash=null;
  areaMM=cArea(pReg);
  buildMask();
}
function afterKeep(){rebuildKeep()}

/* ---------------- density ---------------- */
function ensurePaint(){if(paint)return;PW=128;PH=clamp(Math.round(128*bbox.h/bbox.w),8,512);paint=new Float32Array(PW*PH)}
function updatePaintRange(){pmin=0;pmax=0;if(!paint)return;for(const v of paint){if(v<pmin)pmin=v;if(v>pmax)pmax=v}}
function paintActive(){return !!paint&&(pmin<-0.01||pmax>0.01)}
function paintAt(x,y){
  const u=clamp((x-bbox.x0)/bbox.w*PW-0.5,0,PW-1),v=clamp((y-bbox.y0)/bbox.h*PH-0.5,0,PH-1);
  const i=Math.floor(u),j=Math.floor(v),fu=u-i,fv=v-j,i1=Math.min(i+1,PW-1),j1=Math.min(j+1,PH-1),p=paint;

}
function stamp(x,y){
  ensurePaint();

  const u=(x-bbox.x0)/bbox.w*PW-0.5,v=(y-bbox.y0)/bbox.h*PH-0.5;
  for(let j=Math.floor(v-rv);j<=Math.ceil(v+rv);j++)for(let i=Math.floor(u-ru);i<=Math.ceil(u+ru);i++){
    if(i<0||j<0||i>=PW||j>=PH)continue;
    const dd=((i-u)/ru)**2+((j-v)/rv)**2;if(dd>=1)continue;
    const k=j*PW+i;paint[k]=clamp(paint[k]+sign*S.brushStrength*0.16*(1-dd)**2,-3,3);

}
const isDensBrush=()=>S.brushMode==='denser'||S.brushMode==='sparser';
function noise2(x,y,seed){

  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);

function gradT(x,y){

      const cs=[[bbox.x0,bbox.y0],[bbox.x1,bbox.y0],[bbox.x0,bbox.y1],[bbox.x1,bbox.y1]].map(c=>c[0]*dx+c[1]*dy);

    }

      const md=Math.max(...[[bbox.x0,bbox.y0],[bbox.x1,bbox.y0],[bbox.x0,bbox.y1],[bbox.x1,bbox.y1]].map(c=>Math.hypot(c[0]-cx,c[1]-cy)))*0.85;

    }

      const i=Math.floor(u),j=Math.floor(v),fu=u-i,fv=v-j,i1=Math.min(i+1,densImg.w-1),j1=Math.min(j+1,densImg.h-1),d=densImg.d,w=densImg.w;
      const l=(d[j*w+i]*(1-fu)+d[j*w+i1]*fu)*(1-fv)+(d[j1*w+i]*(1-fu)+d[j1*w+i1]*fu)*fv;

function hasGrad(){return S.grad!=='none'&&S.ratio>1.001&&!(S.grad==='image'&&!densImg)}
function hasDens(){return hasGrad()||paintActive()}
function densBounds(){let lo=0,hi=hasGrad()?2*Math.log(S.ratio):0;if(paintActive()){lo+=pmin;hi+=pmax}return [Math.exp(lo),Math.exp(hi)]}

function gradCentre(){return S.grad==='radial'?[bbox.x0+bbox.w*S.cx/100,bbox.y0+bbox.h*S.cy/100]:[bbox.x0+bbox.w/2,bbox.y0+bbox.h/2]}
function computeIntegral(){
  const n=90;let sum=0,cnt=0;const dx=bbox.w/n,dy=bbox.h/n;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const x=bbox.x0+(i+.5)*dx,y=bbox.y0+(j+.5)*dy;if(inside(x,y)){sum+=dens(x,y);cnt++}}
  intD=cnt?sum/cnt*areaMM:areaMM;

/* ---------------- point generation ---------------- */
function baseSpacing(uniform){
  if(S.sizeBy==='spacing')return Math.max(0.5,S.spacing);
  const N=clamp(S.count,3,MAXP);
  return Math.sqrt((uniform?areaMM:intD)/(N*0.866));
}
function genRandom(rng,s){
  const N=Math.min(MAXP,S.sizeBy==='count'?S.count:Math.round(intD/(0.866*s*s)));
  const dmax=densBounds()[1], dd=hasDens(), out=[];let tries=0;
  while(out.length<N&&tries<N*400){
    tries++;const x=bbox.x0+rng()*bbox.w,y=bbox.y0+rng()*bbox.h;
    if(!inside(x,y))continue;
    if(dd&&rng()*dmax>dens(x,y))continue;
    out.push([x,y]);
  }
  return out;
}
function poissonRun(rng,s,f){

  const cell=Math.max(rmin,rmax/12), cols=Math.ceil(bbox.w/cell)+1, rows=Math.ceil(bbox.h/cell)+1;
  const grid=new Map(), pts=[], rs=[], active=[], R=Math.ceil(rmax/cell);
  const ok=(x,y,r)=>{
    const gx=Math.floor((x-bbox.x0)/cell),gy=Math.floor((y-bbox.y0)/cell);
    for(let i=gx-R;i<=gx+R;i++)for(let j=gy-R;j<=gy+R;j++){
      const l=grid.get(i*65536+j);if(!l)continue;
      for(const k of l){const dx=pts[k][0]-x,dy=pts[k][1]-y,m=(r+rs[k])*0.5;if(dx*dx+dy*dy<m*m)return false}
    }

  };
  const add=(x,y)=>{
    if(x<bbox.x0||y<bbox.y0||x>bbox.x1||y>bbox.y1||!inside(x,y))return false;
    const r=rOf(x,y);if(!ok(x,y,r))return false;
    const k=pts.length;pts.push([x,y]);rs.push(r);active.push(k);
    const key=Math.floor((x-bbox.x0)/cell)*65536+Math.floor((y-bbox.y0)/cell);
    const l=grid.get(key);if(l)l.push(k);else grid.set(key,[k]);

  };

  while(pts.length<MAXP*1.2){
    if(!active.length){if(darts++>1500)break;add(bbox.x0+rng()*bbox.w,bbox.y0+rng()*bbox.h);continue}
    const ai=Math.floor(rng()*active.length),a=pts[active[ai]],ra=rs[active[ai]];let found=false;
    for(let t=0;t<24;t++){const ang=rng()*Math.PI*2,d=ra*(1+rng());if(add(a[0]+Math.cos(ang)*d,a[1]+Math.sin(ang)*d)){found=true;break}}
    if(!found){active[ai]=active[active.length-1];active.pop()}
  }

}
function genPoisson(rng,s){
  const seed=rng()*4294967296;
  if(S.sizeBy==='spacing')return poissonRun(mulberry32(seed),s,1).slice(0,MAXP);
  let f=0.95, pts=poissonRun(mulberry32(seed),s,f);
  const N=clamp(S.count,3,MAXP);
  if(Math.abs(pts.length-N)/N>0.04){f*=Math.sqrt(pts.length/N);pts=poissonRun(mulberry32(seed),s,f)}

function jit(rng,s){const a=rng()*Math.PI*2,r=Math.sqrt(rng())*S.jitter/100*s*0.5;return [Math.cos(a)*r,Math.sin(a)*r]}

  const out=[], dy=hex?s*0.8660254:s;
  const rows=Math.ceil(bbox.h/dy)+2, cols=Math.ceil(bbox.w/s)+2;
  const ox=bbox.x0+(bbox.w-(cols-2)*s)/2, oy=bbox.y0+(bbox.h-(rows-2)*dy)/2;
  for(let r=-1;r<rows;r++)for(let c=-1;c<cols;c++){
    const j=jit(rng,s);const x=ox+c*s+(hex&&(r&1)?s/2:0)+j[0],y=oy+r*dy+j[1];

function genSpiral(rng,s){

  const R=Math.max(...[[bbox.x0,bbox.y0],[bbox.x1,bbox.y0],[bbox.x0,bbox.y1],[bbox.x1,bbox.y1]].map(c=>Math.hypot(c[0]-cx,c[1]-cy)));
  const NR=160, cum=new Float64Array(NR+1);

  const total=cum[NR];

    const x=cx+r*Math.cos(k*GA)+j[0], y=cy+r*Math.sin(k*GA)+j[1];

}
function genPoints(rng){
  const uniform = S.dist==='hex'||S.dist==='square';
  const s=baseSpacing(uniform); lastSpacing=s;
  switch(S.dist){
    case 'random': return genRandom(rng,s);
    case 'hex': return genGrid(rng,s,true);
    case 'square': return genGrid(rng,s*Math.sqrt(0.866),false);
    case 'spiral': return genSpiral(rng,s);
    default: return genPoisson(rng,s);

}

/* ---------------- relaxation (density-weighted Lloyd) ---------------- */
function vBounds(){return [bbox.x0-2,bbox.y0-2,bbox.x1+2,bbox.y1+2]}
function cellSize(){return Math.max(0.3,Math.sqrt(areaMM/Math.max(20,points.length)))}
function relaxOnce(){
  if(points.length<2)return 0;
  const v=d3.Delaunay.from(points).voronoi(vBounds());
  const cs=cellSize();
  if(!regionHash||Math.abs(regionHash.cell-cs)/cs>0.3) regionHash=makeHash(pRegF,cs);
  const g=hasDens();let maxMove=0;
  const next=points.map((p,i)=>{
    const poly=v.cellPolygon(i); if(!poly)return p;
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of poly){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])}
    let polys=[poly.slice(0,-1)];
    if(hashHit(regionHash,x0,y0,x1,y1)) polys=cInter([toInt(polys[0])],pReg).map(toF);
    let W=0,X=0,Y=0;
    for(const pp of polys){
      if(pp.length<3)continue;const a=pp[0];
      for(let k=1;k+1<pp.length;k++){
        const b=pp[k],c=pp[k+1];const A=((b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]))/2;
        const mx=(a[0]+b[0]+c[0])/3,my=(a[1]+b[1]+c[1])/3;const w=A*(g?Math.pow(dens(mx,my),2):1);

    }
    if(Math.abs(W)<1e-12)return p;
    const nx=X/W,ny=Y/W;
    if(!inside(nx,ny))return p;
    maxMove=Math.max(maxMove,Math.hypot(nx-p[0],ny-p[1]));
    return [nx,ny];
  });
  points=next;
  return maxMove;
}

/* ---------------- geometry: holes, lines ---------------- */
const minFeat=()=>S.machine==='cnc'?S.bitDia:S.minFeature;
const effRadius=()=>Math.max(0,S.radius,S.machine==='cnc'?S.bitDia/2+0.01:0);
function webAt(p){
  if(!S.webGrow||!hasDens())return S.web;
  const rel=Math.sqrt(densBounds()[1]/dens(p[0],p[1]));
  return S.web*(1+S.webGrow/100*(rel-1));

/* pole of inaccessibility: the point inside a hole farthest from its edge */
function poleOf(F){

  let sx=(x1-x0)/8,sy=(y1-y0)/8,best=[0,0,-1];
  for(let i=0;i<=8;i++)for(let j=0;j<=8;j++){const x=x0+i*sx,y=y0+j*sy,d=dist(x,y);if(d>best[2])best=[x,y,d]}

function circleInt(x,y,r){return [fixO(toInt(ellipsePts(x,y,r,r)))]}
function shapeHole(ip){

function computeGeometry(){

  del=d3.Delaunay.from(points);vor=del.voronoi(vBounds());
  const cs=cellSize();
  if(S.mode==='lines'){
    const seen=new Set(),segs=[];
    for(let i=0;i<points.length;i++){
      const poly=vor.cellPolygon(i);if(!poly)continue;
      for(let k=0;k+1<poly.length;k++){
        const a=poly[k],b=poly[k+1];
        const ka=Math.round(a[0]*1e3)+','+Math.round(a[1]*1e3),kb=Math.round(b[0]*1e3)+','+Math.round(b[1]*1e3);

    const poly=vor.cellPolygon(i);if(!poly)continue;

    if(!ip.length)continue;

/* ---------------- manufacturing check + cut report ---------------- */
let checkT=0;
function scheduleCheck(){clearTimeout(checkT);thin=[];checkT=setTimeout(()=>{runCheck();computeReport();draw();updateStats()},autoOn?700:220)}
function pathBox(paths){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of paths)for(const q of p){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])}return [x0,y0,x1,y1]}
function runCheck(){
  thin=[];thinCount=0;
  if(!S.check||S.mode==='lines'||!del)return;
  const h=S.minWeb/2*0.97, hI=h*SC, J=CL.JoinType.jtRound, tiny=(S.minWeb*0.05)**2;
  const byPt=new Map();holes.forEach((H,k)=>byPt.set(H.i,k));
  const dil=holes.map(H=>cOffset(H.ints,hI,J,30));
  const band=cDiff(region,cOffset(region,-hI,J,30));
  const edgeHash=makeHash(regionF,cellSize());
  const pieces=[];
  const test=(a,b)=>{const x=cInter(a,b);if(x.length&&cArea(x)>tiny){pieces.push(...x);thinCount++}};
  const mDil=mounts.map(m=>circleInt(m[0],m[1],S.mountD/2+h)), mBox=mounts.map(m=>{const R=S.mountD/2+2*h;return [m[0]-R,m[1]-R,m[0]+R,m[1]+R]});
  holes.forEach((H,k)=>{
    for(const j of del.neighbors(H.i)){if(j<=H.i)continue;const kk=byPt.get(j);if(kk!==undefined)test(dil[k],dil[kk])}
    const b=pathBox(H.paths);
    if(hashHit(edgeHash,b[0]-2*h,b[1]-2*h,b[2]+2*h,b[3]+2*h))test(dil[k],band);
    mBox.forEach((mb,m)=>{if(b[0]<mb[2]&&b[2]>mb[0]&&b[1]<mb[3]&&b[3]>mb[1])test(dil[k],mDil[m])});
  });
  mDil.forEach((d,m)=>{test(d,band);for(let n=m+1;n<mounts.length;n++)test(d,mDil[n])});
  thin=pieces.map(toF);
}
function computeReport(){
  const list=[];
  if(S.mode==='lines')edgesF.forEach(p=>list.push([p,false]));
  else holes.forEach(H=>H.paths.forEach(p=>list.push([p,true])));
  mountF.forEach(p=>list.push([p,true]));
  if(S.outline)regionF.forEach(p=>list.push([p,true]));
  let len=0;
  for(const [p,closed] of list){for(let k=1;k<p.length;k++)len+=Math.hypot(p[k][0]-p[k-1][0],p[k][1]-p[k-1][1]);if(closed&&p.length>1)len+=Math.hypot(p[0][0]-p[p.length-1][0],p[0][1]-p[p.length-1][1])}

const fmtLen=mm=>mm>=1000?(mm/1000).toFixed(2)+' m':Math.round(mm)+' mm';
function fmtTime(s){s=Math.round(s);if(s<60)return s+' s';const m=Math.floor(s/60);if(m<60)return m+' min '+(s%60)+' s';return Math.floor(m/60)+' h '+(m%60)+' min'}
function updateReport(){
  const el=$('#report');if(!el)return;
  if(!report){el.textContent='Measuring…';return}
  let h=`<b>${fmtLen(report.len)}</b> of cutting in ${report.n} paths${S.passes>1?`, ${S.passes} passes`:''}. About <b>${fmtTime(report.time)}</b> per sheet.`;
  if(S.check&&S.mode!=='lines'){
    const sm=holes.filter(x=>x.small).length+(mounts.length&&S.mountD<minFeat()?mounts.length:0),pr=[];
    if(thinCount)pr.push(`${thinCount} web${thinCount>1?'s':''} thinner than ${S.minWeb} mm`);

    h+=pr.length?`<br><span class="bad">${pr.join(', ')}.</span>`:`<br><span class="good">No thin webs or undersized holes.</span>`;

  if(S.machine==='cnc'&&S.radius<S.bitDia/2)h+=`<br>Corners rounded to ${(S.bitDia/2).toFixed(2)} mm to fit the bit.`;

/* ---------------- colour ---------------- */
function hexRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function samplePal(cols,t){
  t=clamp(t,0,1)*(cols.length-1);const i=Math.min(cols.length-2,Math.floor(t)),f=t-i;
  const a=hexRgb(cols[i]),b=hexRgb(cols[i+1]);

function holeColors(){
  const pal=PALETTES[S.palette]||PALETTES.terrazzo, cols=pal.c;
  if(S.colorBy==='random') return holes.map(h=>cols[Math.floor(hash2(h.i,S.seed,7)*cols.length)]);
  let ts;
  if(S.colorBy==='size'){
    const order=holes.map((h,k)=>[h.area,k]).sort((a,b)=>a[0]-b[0]);ts=new Array(holes.length);
    order.forEach((o,r)=>ts[o[1]]=r/Math.max(1,holes.length-1));
  } else if(S.colorBy==='gradient'&&hasGrad()) ts=holes.map(h=>gradT(points[h.i][0],points[h.i][1]));

/* ---------------- drawing ---------------- */
const cv=$('#cv'), ctx=cv.getContext('2d');
let css={};
function readCss(){const s=getComputedStyle(document.documentElement);for(const k of ['mat','mat-line','mat-line-2','cut','outline-cut','ink','focus'])css[k]=s.getPropertyValue('--'+k).trim()}

function drawArt(c,v,opts){
  if(S.mode==='lines'){
    c.beginPath();trace(c,regionF,v);trace(c,mountF,v);c.fillStyle='#FBFBF8';c.fill('evenodd');
    c.lineJoin='round';c.lineCap='round';
    c.strokeStyle='#1D2A3A';c.lineWidth=Math.max(opts.preview?1:0.5,S.lineWeight*v.s);
    c.beginPath();trace(c,edgesF,v,false);trace(c,mountF,v);if(S.outline)trace(c,regionF,v);c.stroke();
    return;
  }

    c.beginPath();trace(c,regionF,v);trace(c,mountF,v);c.fillStyle=pal.bg;c.fill('evenodd');
    const cols=holeColors();
    holes.forEach((h,k)=>{c.beginPath();trace(c,h.paths,v);c.fillStyle=cols[k];c.fill('evenodd')});

  }

let paintCv=null;
function drawPaintOverlay(){
  if(!paintActive())return;
  if(!paintCv)paintCv=document.createElement('canvas');
  paintCv.width=PW;paintCv.height=PH;const c=paintCv.getContext('2d'),img=c.createImageData(PW,PH);
  for(let k=0;k<PW*PH;k++){const v=paint[k],a=Math.min(1,Math.abs(v)/2)*190;
    if(v>0){img.data[k*4]=47;img.data[k*4+1]=125;img.data[k*4+2]=225}else{img.data[k*4]=240;img.data[k*4+1]=140;img.data[k*4+2]=40}
    img.data[k*4+3]=a}
  c.putImageData(img,0,0);
  ctx.save();ctx.beginPath();trace(ctx,regionF,view);ctx.clip('evenodd');ctx.imageSmoothingEnabled=true;
  ctx.drawImage(paintCv,bbox.x0*view.s+view.x,bbox.y0*view.s+view.y,bbox.w*view.s,bbox.h*view.s);ctx.restore();
}

function drawMatGrid(){
  const step=10, x0=Math.floor((-view.x/view.s)/step)*step, y0=Math.floor((-view.y/view.s)/step)*step;
  const x1=(cw-view.x)/view.s, y1=(ch-view.y)/view.s;
  if(view.s*step<6)return;
  ctx.lineWidth=1;
  for(const strong of [false,true]){
    ctx.strokeStyle=strong?css['mat-line-2']:css['mat-line'];ctx.beginPath();
    for(let x=x0;x<=x1;x+=step){if((Math.round(x)%50===0)!==strong)continue;const sx=Math.round(x*view.s+view.x)+.5;ctx.moveTo(sx,0);ctx.lineTo(sx,ch)}
    for(let y=y0;y<=y1;y+=step){if((Math.round(y)%50===0)!==strong)continue;const sy=Math.round(y*view.s+view.y)+.5;ctx.moveTo(0,sy);ctx.lineTo(cw,sy)}

  }
}

let drawQueued=false;
function draw(){if(drawQueued)return;drawQueued=true;requestAnimationFrame(()=>{drawQueued=false;drawNow()})}
function drawNow(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=css.mat;ctx.fillRect(0,0,cw,ch);
  drawMatGrid();
  // drop shadow under sheet
  ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=18;ctx.shadowOffsetY=6;
  ctx.beginPath();trace(ctx,regionF,view);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fill('evenodd');ctx.restore();
  ctx.fillStyle=css.mat;ctx.beginPath();trace(ctx,regionF,view);ctx.fill('evenodd');
  drawArt(ctx,view,{preview:true});
  const light=S.mode==='mosaic'?['reef','canopy','glass','kiln'].includes(S.palette):S.mode==='holes'&&['walnut','black','felt'].includes(S.material);
  const ovInk=light?'rgba(255,255,255,':'rgba(20,30,40,';
  if(S.edges&&vor){ctx.beginPath();vor.render(proxy(ctx,view));ctx.strokeStyle=ovInk+'.45)';ctx.lineWidth=1;ctx.stroke()}
  if(S.delaunay&&del){ctx.beginPath();del.render(proxy(ctx,view));ctx.strokeStyle='rgba(47,125,225,.55)';ctx.lineWidth=1;ctx.stroke()}
  if(S.sites){
    const r=clamp(view.s*lastSpacing*0.05,1.2,3.2);
    ctx.fillStyle=ovInk+'.9)';ctx.beginPath();
    for(const p of points){const x=p[0]*view.s+view.x,y=p[1]*view.s+view.y;ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,Math.PI*2)}
    ctx.fill();
  }
  if(S.check&&S.mode!=='lines'){
    if(thin.length){ctx.beginPath();trace(ctx,thin,view);ctx.fillStyle='rgba(236,0,140,.85)';ctx.fill()}
    const sm=holes.filter(h=>h.small);
    ctx.beginPath();for(const h of sm)trace(ctx,h.paths,view);if(mounts.length&&S.mountD<minFeat())trace(ctx,mountF,view);
    ctx.strokeStyle='#FF8A00';ctx.lineWidth=2.5;ctx.stroke();
  }
  if(mounts.length&&(S.sites||tool==='mount')){
    ctx.save();ctx.setLineDash([4,4]);ctx.strokeStyle=ovInk+'.55)';ctx.lineWidth=1;ctx.beginPath();
    for(const m of mounts){const x=m[0]*view.s+view.x,y=m[1]*view.s+view.y,R=(S.mountD/2+S.mountClear)*view.s;ctx.moveTo(x+R,y);ctx.arc(x,y,R,0,Math.PI*2)}
    ctx.stroke();ctx.restore();
  }
  if(tool==='brush'){

    ctx.save();ctx.setLineDash([6,4]);ctx.strokeStyle=css.focus;ctx.lineWidth=1.5;ctx.beginPath();trace(ctx,keepF,view);ctx.stroke();ctx.restore();

    }
  }

    ctx.beginPath();ctx.arc(mouseW[0]*view.s+view.x,mouseW[1]*view.s+view.y,R,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2.5;ctx.stroke();ctx.strokeStyle=css.focus;ctx.lineWidth=1.2;ctx.stroke();

    ctx.strokeStyle=css.focus;ctx.lineWidth=2;ctx.stroke();
  }
}
function proxy(c,v){return{moveTo:(x,y)=>c.moveTo(x*v.s+v.x,y*v.s+v.y),lineTo:(x,y)=>c.lineTo(x*v.s+v.x,y*v.s+v.y),closePath:()=>c.closePath(),rect:(x,y,w,h)=>c.rect(x*v.s+v.x,y*v.s+v.y,w*v.s,h*v.s),arc:(x,y,r,a,b)=>c.arc(x*v.s+v.x,y*v.s+v.y,r,a,b)}}

function resize(){
  const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;
  const nw=r.width,nh=r.height;if(!nw||!nh)return;
  const first=!cw;
  if(!first){view.x+= (nw-cw)/2;view.y+=(nh-ch)/2}
  cw=nw;ch=nh;cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);

}
function fit(){
  const pad=cw<600?28:70;
  const s=Math.min((cw-pad*2)/bbox.w,(ch-pad*2-(cw<600?60:40))/bbox.h);
  view.s=s;view.fit=s;view.x=cw/2-(bbox.x0+bbox.w/2)*s;view.y=ch/2-(bbox.y0+bbox.h/2)*s-(cw<600?20:0);

}
function zoomAt(f,sx,sy){

}
function updateZoom(){$('#zfit').textContent=Math.round(view.s/view.fit*100)+'%'}

/* ---------------- stats / undo ---------------- */
function updateStats(){
  // only numbers are interpolated into this markup
  let t=`<b>${points.length|0}</b> cells, seed ${Number(S.seed)}`;
  if(S.mode!=='lines') t+=`, <b>${holes.length}</b> holes`;
  if(dropped) t+=` (${dropped} too small)`;
  if(S.check&&S.mode!=='lines'){const p=thinCount+holes.filter(h=>h.small).length;if(p)t+=`, <span class="bad">${p} problem${p>1?'s':''}</span>`}
  $('#stat').innerHTML=t;
  $('#btnUndo').disabled=!undoStack.length;$('#btnRedo').disabled=!redoStack.length;
  updateReport();
  const mk=$('#tab_make');if(mk){const p=S.check&&S.mode!=='lines'&&(thinCount+holes.filter(h=>h.small).length)>0;mk.classList.toggle('alert',p);mk.setAttribute('aria-label',p?'Make, problems found':'Make')}
}
function snap(){return {p:points.map(q=>q.slice()),m:mounts.map(q=>q.slice()),st:strokes.slice(),pa:paint?paint.slice():null,pw:PW,ph:PH}}
function restore(s){points=s.p;mounts=s.m;strokes=s.st;paint=s.pa;PW=s.pw;PH=s.ph;updatePaintRange();rebuildKeep();computeIntegral();refresh();refreshPanel()}
function pushUndo(){undoStack.push(snap());if(undoStack.length>60)undoStack.shift();redoStack=[]}
function undo(){if(!undoStack.length)return;redoStack.push(snap());restore(undoStack.pop())}
function redo(){if(!redoStack.length)return;undoStack.push(snap());restore(redoStack.pop())}
function refresh(){computeGeometry();draw();updateStats()}

function generate(noUndo){
  stopAuto();if(noUndo!==true)pushUndo();
  const rng=mulberry32(S.seed*2654435761>>>0);
  points=genPoints(rng);
  for(let k=0;k<S.relaxSteps;k++)relaxOnce();
  if(points.length>=MAXP)toast(`Capped at ${MAXP} cells. Raise the spacing for a lighter pattern.`);
  refresh();
}
function rebuildAll(){buildRegion();computeIntegral();generate();fit()}

/* ---------------- auto relax ---------------- */
function stopAuto(){autoOn=false;$('#btnAuto').textContent='▶ Auto-relax'}
function startAuto(){
  autoOn=true;$('#btnAuto').textContent='■ Stop';pushUndo();let n=0;
  const step=()=>{
    if(!autoOn)return;
    const m=relaxOnce();computeGeometry();drawNow();updateStats();n++;
    if(m<lastSpacing*0.004||n>300){stopAuto();toast(`Settled after ${n} steps`);return}
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------------- export ---------------- */
const f3=v=>(Math.round(v*1000)/1000).toString();
function pathD(paths,closed=true){return paths.map(p=>'M'+p.map(q=>f3(q[0]-bbox.x0)+' '+f3(q[1]-bbox.y0)).join('L')+(closed?'Z':'')).join('')}
function svgHead(){const w=f3(bbox.w),h=f3(bbox.h);return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${w}mm" height="${h}mm" viewBox="0 0 ${w} ${h}">\n`}
/* cut paths, optionally compensated for kerf (laser) or bit radius (CNC tool-centre paths) */
function cutSets(){
  const k=S.compensate?(S.machine==='cnc'?S.bitDia/2:S.kerf/2):0;
  const comp=(paths,sign)=>k?cOffset(paths.map(toInt),sign*k*SC,CL.JoinType.jtRound).map(toF):paths;
  return {
    holes:S.mode==='lines'?[]:holes.map(h=>comp(h.paths,-1)).filter(p=>p.length),
    mounts:mountF.map(p=>comp([p],-1)).filter(p=>p.length),
    outline:comp(regionF,1)
  };
}
function exportLaserSvg(){
  const cs=cutSets();let s=svgHead();
  if(S.mode==='lines') s+=`<g id="lines" fill="none" stroke="#FF0000" stroke-width="0.1">\n`+edgesF.map(p=>`<path d="${pathD([p],false)}"/>`).join('\n')+`\n</g>\n`;
  else s+=`<g id="holes" fill="none" stroke="#FF0000" stroke-width="0.1">\n`+cs.holes.map(p=>`<path d="${pathD(p)}"/>`).join('\n')+`\n</g>\n`;
  if(cs.mounts.length) s+=`<g id="mounting-holes" fill="none" stroke="#00A000" stroke-width="0.1">\n`+cs.mounts.map(p=>`<path d="${pathD(p)}"/>`).join('\n')+`\n</g>\n`;
  if(S.outline) s+=`<g id="outline" fill="none" stroke="#0000FF" stroke-width="0.1"><path d="${pathD(cs.outline)}"/></g>\n`;
  download(s+'</svg>','cellwork-laser.svg','image/svg+xml');
  if(S.compensate)toast(S.machine==='cnc'?'Exported tool-centre paths':'Exported with kerf compensation');
}
function exportArtSvg(){
  let s=svgHead();const md=pathD(mountF);
  if(S.mode==='lines'){
    s+=`<path d="${pathD(regionF)}${md}" fill="#FBFBF8" fill-rule="evenodd"/>\n<g fill="none" stroke="#1D2A3A" stroke-width="${S.lineWeight}" stroke-linecap="round" stroke-linejoin="round">\n`+edgesF.map(p=>`<path d="${pathD([p],false)}"/>`).join('\n');
    if(mounts.length)s+=`\n<path d="${md}"/>`;
    if(S.outline)s+=`\n<path d="${pathD(regionF)}"/>`;
    s+='\n</g>\n';
  } else if(S.mode==='mosaic'){
    const pal=PALETTES[S.palette],cols=holeColors();
    s+=`<path d="${pathD(regionF)}${md}" fill="${pal.bg}" fill-rule="evenodd"/>\n`+holes.map((h,k)=>`<path d="${pathD(h.paths)}" fill="${cols[k]}" fill-rule="evenodd"/>`).join('\n')+'\n';
  } else {
    const m=MATERIALS[S.material];
    s+=`<path fill="${m.c}" fill-rule="evenodd" d="${pathD(regionF)}${holes.map(h=>pathD(h.paths)).join('')}${md}"/>\n`;
  }
  download(s+'</svg>','cellwork-artwork.svg','image/svg+xml');
}
function exportDxf(){
  const cs=cutSets();
  const out=['0','SECTION','2','HEADER','9','$ACADVER','1','AC1009','9','$INSUNITS','70','4','0','ENDSEC','0','SECTION','2','ENTITIES'];
  const poly=(p,layer,closed)=>{
    out.push('0','POLYLINE','8',layer,'66','1','70',closed?'1':'0','10','0.0','20','0.0','30','0.0');
    for(const q of p)out.push('0','VERTEX','8',layer,'10',f3(q[0]-bbox.x0),'20',f3(bbox.y1-q[1]),'30','0.0');
    out.push('0','SEQEND','8',layer);
  };
  if(S.mode==='lines')edgesF.forEach(p=>poly(p,'LINES',false));
  else cs.holes.forEach(h=>h.forEach(p=>poly(p,'HOLES',true)));
  cs.mounts.forEach(h=>h.forEach(p=>poly(p,'MOUNTING_HOLES',true)));
  if(S.outline)cs.outline.forEach(p=>poly(p,'OUTLINE',true));
  out.push('0','ENDSEC','0','EOF');
  download(out.join('\r\n')+'\r\n','cellwork.dxf','application/dxf');
}

/* Security: project files come from anywhere, so every value is type- and range-checked
   against DEFAULTS before use. Unknown keys are ignored. */
const ENUMS={shape:['rect','ellipse','hex','ring','custom'],dist:['random','even','hex','square','spiral'],sizeBy:['count','spacing'],
  grad:['none','linear','radial','noise','image'],mode:['holes','lines','mosaic'],material:Object.keys(MATERIALS),palette:Object.keys(PALETTES),
  colorBy:['random','size','gradient','position'],holeShape:['cell','circle','blob','slot'],slotDir:['cell','fixed','radial','around'],
  brushMode:['denser','sparser','keep','clear'],machine:['laser','cnc']};
const RANGES={width:[5,3000],height:[5,3000],cornerR:[0,1500],count:[3,MAXP],spacing:[0.5,500],ratio:[1,8],relaxSteps:[0,60],dpi:[72,1200],
  passes:[1,30],noiseScale:[2,1000],falloff:[0.1,5],web:[0,50],radius:[0,50],margin:[0,500],mountD:[0.5,100],mountClear:[0,200],brushSize:[1,1000]};
const isNum=v=>typeof v==='number'&&Number.isFinite(v);
const hasOwn=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function cleanSettings(raw){
  const out={...DEFAULTS};if(!raw||typeof raw!=='object')return out;
  for(const k of Object.keys(DEFAULTS)){
    if(!hasOwn(raw,k))continue;const v=raw[k],d=DEFAULTS[k];
    if(typeof d==='number'&&isNum(v)){const r=RANGES[k]||[-1e5,1e5];out[k]=clamp(v,r[0],r[1])}
    else if(typeof d==='boolean'&&typeof v==='boolean')out[k]=v;
    else if(typeof d==='string'&&ENUMS[k]&&ENUMS[k].includes(v))out[k]=v;
  }
  return out;
}
const isPt=p=>Array.isArray(p)&&p.length>=2&&isNum(p[0])&&isNum(p[1])&&Math.abs(p[0])<1e5&&Math.abs(p[1])<1e5;
const ptList=(a,max)=>Array.isArray(a)&&a.length<=max?a.filter(isPt).map(p=>[p[0],p[1]]):[];
function cleanCustom(c){
  if(!c||typeof c!=='object'||!isNum(c.aspect)||c.aspect<=0||c.aspect>1000||!Array.isArray(c.paths)||c.paths.length>5000)return null;
  let total=0;const paths=[];
  for(const p of c.paths){const q=ptList(p,200000);total+=q.length;if(total>300000)return null;if(q.length>=3)paths.push(q)}
  return paths.length?{aspect:c.aspect,paths}:null;
}
function loadProject(text){
  const d=JSON.parse(text);if(!d||d.app!=='cellwork')throw new Error('not a Cellwork project');
  S=cleanSettings(d.settings);custom=cleanCustom(d.custom);
  if(S.shape==='custom'&&!custom)S.shape='rect';
  mounts=ptList(d.mounts,500);
  strokes=Array.isArray(d.strokes)?d.strokes.slice(0,2000).filter(st=>st&&(st.m==='keep'||st.m==='clear')&&isNum(st.r)&&st.r>0&&st.r<1000)
    .map(st=>({m:st.m,r:st.r,pts:ptList(st.pts,20000)})).filter(st=>st.pts.length):[];
  paint=null;const pd=d.paint;
  if(pd&&Number.isInteger(pd.w)&&Number.isInteger(pd.h)&&pd.w>0&&pd.h>0&&pd.w<=1024&&pd.h<=1024&&Array.isArray(pd.d)&&pd.d.length===pd.w*pd.h){
    PW=pd.w;PH=pd.h;paint=Float32Array.from(pd.d,v=>isNum(v)?clamp(v,-3,3):0);
  }
  updatePaintRange();
  buildRegion();computeIntegral();buildPanel();syncViewButtons();
  pushUndo();points=ptList(d.points,MAXP*2).slice(0,MAXP);refresh();fit();toast('Project opened');
}

/* ---------------- imports ---------------- */
function splitSubpaths(d){
  const cmds=d.match(/[MmLlHhVvCcSsQqTtAaZz][^MmLlHhVvCcSsQqTtAaZz]*/g)||[];
  const subs=[];for(const c of cmds){if(/^[Mm]/.test(c)||!subs.length)subs.push([c]);else subs[subs.length-1].push(c)}
  return subs.map(a=>a.join(''));
}
const NUM=/[-+]?(?:\d*\.\d+|\d+\.?\d*)(?:[eE][-+]?\d+)?/g;
/* Security: an imported SVG is never inserted as-is. Only geometry elements and geometry
   attributes are copied into fresh elements, so scripts, event handlers, links, external
   resources, styles and foreignObject content are dropped before anything touches the page. */
const SVG_NS='http://www.w3.org/2000/svg';
const SVG_TAGS=new Set(['svg','g','path','rect','circle','ellipse','polygon','polyline']);
const SVG_ATTRS=new Set(['d','points','x','y','width','height','rx','ry','cx','cy','r','transform','viewBox','preserveAspectRatio']);
function cleanSvg(root){
  let count=0;
  const walk=node=>{
    if(node.namespaceURI!==SVG_NS||!SVG_TAGS.has(node.localName))return null;
    if(++count>20000)throw new Error('That SVG has too many elements.');
    const out=document.createElementNS(SVG_NS,node.localName);
    for(const a of node.attributes){
      if(a.namespaceURI||!SVG_ATTRS.has(a.localName))continue;
      const v=a.value;if(v.length>2e6||/url\s*\(|script:|[<>]/i.test(v))continue;
      out.setAttribute(a.localName,v);
    }
    for(const ch of node.children){const c=walk(ch);if(c)out.appendChild(c)}
    return out;
  };

}
function parseSvgOutline(text){

  document.body.appendChild(svg);

    const els=[...svg.querySelectorAll('path,polygon,polyline,rect,circle,ellipse')];
    if(!els.length)throw new Error('No closed shapes found in the SVG.');

    const step=Math.max(total/6000,1e-6);

      const n=clamp(Math.ceil(L/step),12,3000),m=(ref||el).getCTM()||{a:1,b:0,c:0,d:1,e:0,f:0},pts=[];

      if(e.tagName.toLowerCase()!=='path'){sample(e);continue}
      const subs=splitSubpaths(e.getAttribute('d')||'');let prefix='';

          let cp={x:0,y:0};try{cp=t.getPointAtLength(t.getTotalLength())}catch(_){}t.remove();

function loadSvgText(text){

function loadDensityImage(file){
  const img=new Image();img.onload=()=>{
    const w=160,h=Math.max(8,Math.round(160*bbox.h/bbox.w));
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    // cover-fit into the sheet's bounding box
    const s=Math.max(w/img.width,h/img.height);x.drawImage(img,(w-img.width*s)/2,(h-img.height*s)/2,img.width*s,img.height*s);
    const d=x.getImageData(0,0,w,h).data,lum=new Float32Array(w*h);
    for(let i=0;i<w*h;i++){const a=d[i*4+3]/255;lum[i]=((0.2126*d[i*4]+0.7152*d[i*4+1]+0.0722*d[i*4+2])/255)*a+(1-a)}
    densImg={w,h,d:lum,name:file.name};URL.revokeObjectURL(img.src);
    S.grad='image';buildPanel();computeIntegral();generate();toast('Density image loaded. Dark areas get small cells.');
  };
  img.onerror=()=>toast('That image could not be read.');
  if(file.size>MAX_BYTES.image){toast(`That image is too large (limit ${MAX_BYTES.image/1e6} MB).`);return}
  img.src=URL.createObjectURL(file);
}
const MAX_BYTES={svg:15e6,json:50e6,image:40e6};
function handleFile(file){
  if(!file)return;
  const n=file.name.toLowerCase();
  const kind=n.endsWith('.svg')||file.type==='image/svg+xml'?'svg':n.endsWith('.json')?'json':'image';
  if(file.size>MAX_BYTES[kind]){toast(`That file is too large (limit ${MAX_BYTES[kind]/1e6} MB).`);return}
  if(n.endsWith('.svg')||file.type==='image/svg+xml')file.text().then(loadSvgText);
  else if(n.endsWith('.json'))file.text().then(t=>{try{loadProject(t)}catch(e){toast('That file is not a Cellwork project.')}});
  else if(file.type.startsWith('image/'))loadDensityImage(file);
  else toast('Drop an SVG, an image, or a Cellwork project file.');
}

function makeControl(it){

  } else if(it.t==='toggle'){
    const r=el('div','togrow');const s=el('span',null,lab());const b=el('button','switch');b.type='button';b.setAttribute('role','switch');
    b.onclick=()=>set(it,!S[it.k]);r.append(s,b);row._sync=()=>{b.setAttribute('aria-checked',String(!!S[it.k]));s.textContent=lab();b.setAttribute('aria-label',lab())};row.append(r,hint);
  } else if(it.t==='select'){
    const l=el('label','lbl',it.label);const id='s_'+it.k;l.htmlFor=id;const s=el('select');s.id=id;
    for(const [v,t] of it.o){const o=el('option',null,t);o.value=v;s.append(o)}
    const sw=el('div','swatches');
    s.onchange=()=>set(it,typeof it.o[0][0]==='number'?+s.value:s.value);

    row.append(l,s);if(it.swatch)row.append(sw);row.append(hint);

  } else if(it.t==='note'){

  }

}
function fmt(v,it){const d=it.step<0.1?2:it.step<1?1:0;return (+v).toFixed(d)+(it.unit?(it.unit==='×'||it.unit==='%'||it.unit==='°'?'':' ')+it.unit:'')}
function refreshPanel(){for(const {it,row} of ctrls){row.hidden=it.show?!it.show():false;row._sync&&row._sync();row._hint&&row._hint()}}

let pending=null;
function set(it,v,live){
  if(it.k==='shape'&&v==='custom'&&!custom){$('#fSvg').click();return}
  if(it.k==='grad'&&v==='image'&&!densImg){$('#fImg').click();return}
  S[it.k]=v;
  if(it.k==='machine'){S.cutSpeed=v==='cnc'?15:20;S.pierce=v==='cnc'?1.5:0.2}
  if(it.k==='brushMode'&&tool!=='brush')setTool('brush');
  if(live&&!it.live){refreshPanel();return}
  refreshPanel();
  const lvl=it.lvl;
  if(pending)cancelAnimationFrame(pending);
  pending=requestAnimationFrame(()=>{pending=null;apply(lvl)});
}
function apply(lvl){
  if(lvl==='shape')rebuildAll();
  else if(lvl==='region'){buildRegion();computeIntegral();generate()}
  else if(lvl==='points'){computeIntegral();generate()}
  else if(lvl==='geom')refresh();
  else if(lvl==='draw'){draw();updateStats()}
  else if(lvl==='keep'){rebuildKeep();refresh()}
  else if(lvl==='check'){scheduleCheck();updateStats()}
  else draw();
}

/* ---------------- mounting holes, paint actions ---------------- */
function addCornerMounts(noUndo){
  const ins=S.mountInset,safe=cOffset(region,-ins*SC,CL.JoinType.jtRound).map(toF);
  if(!safe.length){toast('The corner inset is too large for this sheet');return}
  if(noUndo!==true)pushUndo();
  const cx=bbox.x0+bbox.w/2,cy=bbox.y0+bbox.h/2;let added=0;
  for(const c of [[bbox.x0+ins,bbox.y0+ins],[bbox.x1-ins,bbox.y0+ins],[bbox.x1-ins,bbox.y1-ins],[bbox.x0+ins,bbox.y1-ins]]){
    for(let t=0;t<=1;t+=0.004){
      const x=c[0]+(cx-c[0])*t,y=c[1]+(cy-c[1])*t;
      if(pipF(x,y,safe)){if(!mounts.some(m=>Math.hypot(m[0]-x,m[1]-y)<S.mountD+S.mountClear)){mounts.push([x,y]);added++}break}
    }
  }
  rebuildKeep();generate(true);refreshPanel();
  if(noUndo!==true)toast(added?`Added ${added} mounting hole${added>1?'s':''}`:'Corner holes are already in place');
}
function removeMounts(){if(!mounts.length)return;pushUndo();mounts=[];rebuildKeep();generate(true);refreshPanel()}
function clearPaint(){if(!paint)return;pushUndo();paint=null;updatePaintRange();computeIntegral();generate(true)}
function clearKeep(){if(!strokes.length)return;pushUndo();strokes=[];rebuildKeep();computeIntegral();generate(true)}

const stage=$('#stage');
const toWorld=(sx,sy)=>[(sx-view.x)/view.s,(sy-view.y)/view.s];
function nearest(sx,sy,maxPx){
  if(!points.length)return -1;const [x,y]=toWorld(sx,sy);
  let i=del?del.find(x,y):-1;
  if(i<0||!points[i]){let bd=1e18;points.forEach((p,k)=>{const d=(p[0]-x)**2+(p[1]-y)**2;if(d<bd){bd=d;i=k}})}
  const p=points[i];return Math.hypot(p[0]*view.s+view.x-sx,p[1]*view.s+view.y-sy)<=maxPx?i:-1;
}
const ptrs=new Map();let drag=null,pinch=null;
function localXY(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
function nearestMount(sx,sy,px){

  mounts.forEach((m,k)=>{const d=Math.hypot(m[0]*view.s+view.x-sx,m[1]*view.s+view.y-sy);if(d<=Math.max(px,S.mountD/2*view.s+4)&&d<bd){bd=d;best=k}});

  cv.setPointerCapture(e.pointerId);const [sx,sy]=localXY(e);ptrs.set(e.pointerId,[sx,sy]);
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),cx:(a[0]+b[0])/2,cy:(a[1]+b[1])/2};
    if(drag&&(drag.type==='point'||drag.type==='mount'||drag.type==='brush')&&undoStack.length){const u=undoStack.pop();if(drag.type==='brush')restore(u)}
    drag=null;return;
  }
  stopAuto();
  const hit=e.pointerType==='touch'?24:14;
  const [x,y]=toWorld(sx,sy);
  if(tool==='pan'||spaceDown||e.button===1){drag={type:'pan',sx,sy,vx:view.x,vy:view.y};stage.classList.add('panning');return}
  if(tool==='brush'&&!e.altKey&&!e.shiftKey){
    pushUndo();drag={type:'brush',pts:[[x,y]],last:[x,y]};
    if(isDensBrush()){stamp(x,y);updatePaintRange()}
    draw();return;
  }
  if(tool==='mount'){
    if(pipF(x,y,regionF)){pushUndo();mounts.push([x,y]);rebuildKeep();refresh();refreshPanel()}
    else toast('Mounting holes must sit on the sheet');
    return;
  }
  if(e.altKey||tool==='add'){
    if(inside(x,y)){pushUndo();points.push([x,y]);refresh()}else toast('Points must sit on the patterned area');return;
  }
  if(e.shiftKey||tool==='erase'){
    const mi=nearestMount(sx,sy,hit);
    if(mi>=0){pushUndo();mounts.splice(mi,1);rebuildKeep();refresh();refreshPanel();drag={type:'erase'};return}
    const i=nearest(sx,sy,hit);if(i>=0){pushUndo();points.splice(i,1);hoverIdx=-1;refresh()}
    drag={type:'erase'};return;
  }
  const mi=nearestMount(sx,sy,hit);
  if(mi>=0){pushUndo();drag={type:'mount',i:mi,moved:false};return}
  const i=nearest(sx,sy,hit);
  if(i>=0){pushUndo();drag={type:'point',i,moved:false}}
  else drag={type:'pan',sx,sy,vx:view.x,vy:view.y};
});
cv.addEventListener('pointermove',e=>{
  const [sx,sy]=localXY(e);
  if(e.pointerType!=='touch'||drag)mouseW=toWorld(sx,sy);
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,[sx,sy]);
  if(pinch&&ptrs.size===2){
    const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]),cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;
    view.x+=cx-pinch.cx;view.y+=cy-pinch.cy;zoomAt(d/pinch.d,cx,cy);pinch={d,cx,cy};return;
  }
  if(!drag){
    if(tool==='brush'||tool==='mount'){draw();return}
    if(e.pointerType==='mouse'&&tool!=='pan'&&tool!=='add'){const h=nearest(sx,sy,14);if(h!==hoverIdx){hoverIdx=h;draw()}}
    return;
  }
  const [x,y]=toWorld(sx,sy);
  if(drag.type==='pan'){view.x=drag.vx+sx-drag.sx;view.y=drag.vy+sy-drag.sy;draw()}
  else if(drag.type==='brush'){
    const [lx,ly]=drag.last,dist=Math.hypot(x-lx,y-ly),step=Math.max(0.3,S.brushSize/6);
    if(dist<step)return;
    if(isDensBrush()){const n=Math.ceil(dist/step);for(let k=1;k<=n;k++)stamp(lx+(x-lx)*k/n,ly+(y-ly)*k/n);updatePaintRange()}
    drag.pts.push([x,y]);drag.last=[x,y];draw();
  }
  else if(drag.type==='mount'){
    if(pipF(x,y,regionF)){mounts[drag.i]=[x,y];drag.moved=true;
      if(!drag.raf)drag.raf=requestAnimationFrame(()=>{if(drag)drag.raf=0;rebuildKeep();refresh()})}
  }
  else if(drag.type==='point'){
    if(inside(x,y)){points[drag.i]=[x,y];drag.moved=true;hoverIdx=drag.i;
      if(!drag.raf)drag.raf=requestAnimationFrame(()=>{if(drag)drag.raf=0;refresh()})}
  } else if(drag.type==='erase'){
    const i=nearest(sx,sy,e.pointerType==='touch'?24:14);if(i>=0){points.splice(i,1);refresh()}
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  const d=drag;drag=null;stage.classList.remove('panning');
  if(e.pointerType==='touch')mouseW=null;
  if(d&&(d.type==='point'||d.type==='mount')&&!d.moved)undoStack.pop();
  if(d&&d.type==='mount'&&d.moved){rebuildKeep();refresh()}
  if(d&&d.type==='brush'){
    if(isDensBrush()){computeIntegral();generate(true)}
    else{strokes.push({m:S.brushMode==='keep'?'keep':'clear',r:S.brushSize/2,pts:d.pts.map(p=>[+p[0].toFixed(3),+p[1].toFixed(3)])});rebuildKeep();refresh()}
  }
  updateStats();
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',()=>{mouseW=null;if(!drag){hoverIdx=-1;draw()}});
cv.addEventListener('wheel',e=>{e.preventDefault();const [sx,sy]=localXY(e);zoomAt(Math.exp(-e.deltaY*(e.deltaMode===1?0.05:0.0018)),sx,sy)},{passive:false});

function setTool(t){if(isMobile()&&t!==tool){if(t==='brush')showTab('density');else if(t==='mount')showTab('mounts')}tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===t)));hoverIdx=-1;refreshPanel();draw()}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
function syncViewButtons(){document.querySelectorAll('[data-ov]').forEach(b=>b.setAttribute('aria-pressed',String(!!S[b.dataset.ov])))}
document.querySelectorAll('[data-ov]').forEach(b=>b.onclick=()=>{S[b.dataset.ov]=!S[b.dataset.ov];syncViewButtons();draw()});
$('#zin').onclick=()=>zoomAt(1.25,cw/2,ch/2);
$('#zout').onclick=()=>zoomAt(0.8,cw/2,ch/2);
$('#zfit').onclick=fit;
$('#btnGen').onclick=generate;
$('#btnRelax').onclick=()=>{stopAuto();pushUndo();relaxOnce();refresh()};
$('#btnAuto').onclick=()=>autoOn?stopAuto():startAuto();
$('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;

window.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea'))return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.code==='Space'){if(!spaceDown){spaceDown=true;stage.classList.add('panning')}if(!e.target.closest('button'))e.preventDefault();return}
  if(k==='g')generate();else if(k==='r'){pushUndo();relaxOnce();refresh()}else if(k==='f')fit();
  else if(k==='v')setTool('move');else if(k==='a')setTool('add');else if(k==='e')setTool('erase');else if(k==='h')setTool('pan');else if(k==='b')setTool('brush');else if(k==='m')setTool('mount');
});
window.addEventListener('keyup',e=>{if(e.code==='Space'){spaceDown=false;if(!drag)stage.classList.remove('panning')}});

// files
$('#fSvg').onchange=e=>{handleFile(e.target.files[0]);e.target.value=''};
$('#fImg').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)loadDensityImage(f)};
$('#fProj').onchange=e=>{handleFile(e.target.files[0]);e.target.value=''};
['dragenter','dragover'].forEach(t=>stage.addEventListener(t,e=>{e.preventDefault();stage.classList.add('dragover')}));
['dragleave','drop'].forEach(t=>stage.addEventListener(t,e=>{e.preventDefault();stage.classList.remove('dragover')}));
stage.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];handleFile(f)});

let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

// presets menu
const ps=$('#preset');for(const [k,p] of Object.entries(PRESETS)){const o=el('option',null,p.name);o.value=k;ps.append(o)}
ps.onchange=()=>{applyPreset(ps.value);ps.value=''};

// theme
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readCss();draw()});

/* ---------------- boot ---------------- */
readCss();
buildRegion();computeIntegral();
buildPanel();buildTabs();syncViewButtons();
new ResizeObserver(resize).observe(stage);
generate();undoStack=[];updateStats();
</script>
</body>
</html>
